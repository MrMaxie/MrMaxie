<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">maxie.dev animated GitHub banner</title>
  <desc id="desc">A restrained dark technical banner with a moving spotlight, dotted grid, and blue, violet, and gold signal paths.</desc>
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.15" fill="#35353b" />
    </pattern>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#79c9ff" stop-opacity="0.22" />
      <stop offset="0.45" stop-color="#79c9ff" stop-opacity="0.08" />
      <stop offset="1" stop-color="#79c9ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#b39aff" stop-opacity="0.16" />
      <stop offset="1" stop-color="#b39aff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79c9ff" />
      <stop offset="0.58" stop-color="#b39aff" />
      <stop offset="1" stop-color="#ffd166" />
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <clipPath id="frameClip">
      <rect x="24" y="24" width="1232" height="272" />
    </clipPath>
    <style>
      .drift-blue { animation: drift-blue 12s ease-in-out infinite alternate; }
      .drift-violet { animation: drift-violet 15s ease-in-out infinite alternate; }
      .signal {
        stroke-dasharray: 1180;
        stroke-dashoffset: 1180;
        opacity: 0;
        animation: signal-cycle 12s cubic-bezier(.4,0,.2,1) infinite;
      }
      .signal-2 { animation-delay: 4s; }
      .signal-3 { animation-delay: 8s; }

      @keyframes drift-blue {
        from { transform: translate(-70px, -12px) scale(.94); opacity: .7; }
        to { transform: translate(240px, 18px) scale(1.08); opacity: 1; }
      }
      @keyframes drift-violet {
        from { transform: translate(120px, 8px) scale(1.04); opacity: .55; }
        to { transform: translate(-150px, -12px) scale(.92); opacity: .95; }
      }
      @keyframes signal-cycle {
        0%, 2% { stroke-dashoffset: 1180; opacity: 0; }
        7% { opacity: .95; }
        15%, 19% { stroke-dashoffset: 0; opacity: .95; }
        27% { stroke-dashoffset: -1180; opacity: 0; }
        100% { stroke-dashoffset: -1180; opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .signal { stroke-dashoffset: 0; opacity: .58; }
      }
    </style>
  </defs>

  <rect width="1280" height="320" fill="#131315" />
  <rect x="24" y="24" width="1232" height="272" fill="#1a1a1d" stroke="#35353b" />

  <g clip-path="url(#frameClip)">
    <rect x="24" y="24" width="1232" height="272" fill="url(#grid)" opacity="0.72" />

    <ellipse class="drift-blue" cx="415" cy="145" rx="330" ry="185" fill="url(#blueGlow)" filter="url(#softBlur)" />
    <ellipse class="drift-violet" cx="1000" cy="176" rx="300" ry="170" fill="url(#violetGlow)" filter="url(#softBlur)" />

    <g fill="none" stroke="#35353b" stroke-width="1">
      <path d="M220 86H405L451 132H622" />
      <path d="M338 238H520L566 192H746L790 148H1048" />
      <path d="M694 82H872L920 130H1182" />
      <path d="M812 256H1004L1040 220H1210" />
      <rect x="371" y="70" width="160" height="96" />
      <rect x="928" y="118" width="170" height="106" />
    </g>

    <path class="signal signal-1" d="M48 112H252L314 80H544L608 128H790L846 92H1018L1080 132H1232" fill="none" stroke="url(#signal)" stroke-linecap="square" stroke-width="2" />
    <path class="signal signal-2" d="M48 170H252L314 138H544L608 186H790L846 150H1018L1080 190H1232" fill="none" stroke="url(#signal)" stroke-linecap="square" stroke-width="2" />
    <path class="signal signal-3" d="M48 228H252L314 196H544L608 244H790L846 208H1018L1080 248H1232" fill="none" stroke="url(#signal)" stroke-linecap="square" stroke-width="2" />
  </g>

  <g aria-label="maxie.dev" font-family="Outfit, Arial, sans-serif" font-size="29" font-weight="600" letter-spacing="-1">
    <text x="64" y="84" fill="#f3f3f5">maxie</text>
    <text x="139" y="84" fill="#79c9ff">.dev</text>
  </g>

</svg>
